<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Supervivencia Game Dev - 1º DAW</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons para los iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .slide-content {
            display: none;
        }

        .slide-content.active {
            display: block;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="absolute inset-0 opacity-10 pointer-events-none overflow-hidden">
        <div class="absolute top-10 left-10 w-64 h-64 bg-blue-500 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-purple-500 rounded-full blur-[120px]"></div>
    </div>

    <!-- Contenedor Principal -->
    <div
        class="w-full max-w-4xl bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-700 shadow-2xl relative overflow-hidden flex flex-col h-[550px] z-10">

        <!-- Barra de Progreso -->
        <div class="h-1 bg-slate-800 w-full overflow-hidden">
            <div id="progress" class="progress-bar h-full bg-blue-500 w-[10%]"></div>
        </div>

        <div class="p-8 flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="flex items-center space-x-6 mb-8">
                <div id="icon-container" class="p-4 bg-slate-800 rounded-xl shadow-inner border border-slate-700">
                    <i id="slide-icon" data-lucide="gamepad-2" class="w-12 h-12 text-blue-400"></i>
                </div>
                <div>
                    <h2 id="slide-number" class="text-xs font-black tracking-widest text-blue-500 uppercase mb-1">
                        Diapositiva 1 de 10
                    </h2>
                    <h1 id="slide-title" class="text-3xl md:text-4xl font-extrabold tracking-tight">
                        Cargando...
                    </h1>
                    <p id="slide-subtitle" class="text-slate-400 font-medium italic">
                        Espere un momento
                    </p>
                </div>
            </div>

            <!-- Contenido Dinámico -->
            <div id="content-area" class="flex-1 overflow-y-auto px-4 custom-scrollbar">
                <!-- El contenido se inyecta vía JS -->
            </div>
        </div>

        <!-- Navegación Inferior -->
        <div class="p-6 border-t border-slate-800 flex justify-between items-center bg-slate-900/50">
            <button onclick="prevSlide()"
                class="p-3 rounded-full hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                <i data-lucide="chevron-left"></i>
            </button>

            <div id="dots" class="flex space-x-1">
                <!-- Puntos de navegación -->
            </div>

            <button onclick="nextSlide()"
                class="p-3 rounded-full bg-blue-600 hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/20">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>
    </div>

    <p class="mt-6 text-slate-500 text-sm font-mono tracking-tighter uppercase">
        Usa las flechas ⬅️ ➡️ del teclado para navegar
    </p>

    <script>
        const slides = [
            {
                title: "Sprint de Desarrollo Java",
                subtitle: "De la Idea al MVP en 28 Horas",
                icon: "gamepad-2",
                iconColor: "text-blue-400",
                content: `
                    <div class="space-y-4">
                        <p class="text-xl text-gray-300 italic">"Terminar un juego pequeño es mejor que dejar a medias uno grande."</p>
                        <div class="bg-blue-900/30 p-6 rounded-lg border border-blue-500/50">
                            <h3 class="font-bold text-blue-400 mb-2">Objetivo del Proyecto:</h3>
                            <ul class="list-disc ml-6 space-y-2">
                                <li>Entregar un MVP (Producto Mínimo Viable).</li>
                                <li>Foco en mecánicas básicas (Core Loop).</li>
                                <li>Código limpio y documentado en Java.</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            {
                title: "El GDD: La Brújula",
                subtitle: "¿Qué es y qué NO es?",
                icon: "file-text",
                iconColor: "text-green-400",
                content: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-green-900/20 p-4 rounded border border-green-500/30">
                            <h3 class="text-green-400 font-bold mb-2">✅ ES:</h3>
                            <ul class="text-sm space-y-2">
                                <li>Un documento técnico vivo.</li>
                                <li>El contrato del equipo.</li>
                                <li>Guía rápida de diseño.</li>
                            </ul>
                        </div>
                        <div class="bg-red-900/20 p-4 rounded border border-red-500/30">
                            <h3 class="text-red-400 font-bold mb-2">❌ NO ES:</h3>
                            <ul class="text-sm space-y-2">
                                <li>Una novela de 50 páginas.</li>
                                <li>Un manual de usuario.</li>
                                <li>Algo inamovible.</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            {
                title: "GDD en GitHub",
                subtitle: "Simplicidad y Markdown",
                icon: "github",
                iconColor: "text-purple-400",
                content: `
                    <div class="space-y-4 text-sm">
                        <p class="text-gray-300">Escribimos donde programamos.</p>
                        <div class="bg-gray-800 p-4 rounded-md font-mono text-xs border border-gray-600">
                            <p class="text-blue-400"># GDD: Mi Súper Juego Java</p>
                            <p class="text-gray-400">## 1. High Concept</p>
                            <p class="text-white">- Un shooter 2D tipo virus.</p>
                            <p class="text-gray-400">## 2. Core Loop</p>
                            <p class="text-white">- Infectar archivos -> Escapar.</p>
                        </div>
                        <p class="text-xs text-purple-300 italic">Tip: Usa GDD.md en la raíz del repo.</p>
                    </div>
                `
            },
            {
                title: "Kanban: Tu Radar",
                subtitle: "Visualizar para avanzar",
                icon: "layout",
                iconColor: "text-yellow-400",
                content: `
                    <div class="flex justify-between space-x-2">
                        ${["To Do", "Doing", "Testing", "Done"].map(col => `
                            <div class="flex-1 bg-gray-700/50 p-2 rounded border border-gray-600 text-center">
                                <span class="text-[10px] font-bold uppercase text-gray-400">${col}</span>
                                <div class="mt-4 h-16 bg-gray-800/50 rounded border-dashed border border-gray-500 flex items-center justify-center">
                                    <div class="w-4 h-2 bg-yellow-500/30 rounded"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <p class="mt-4 text-xs text-gray-400">Si una tarea no está en el Kanban, no se está haciendo.</p>
                `
            },
            {
                title: "Jerarquía de Tareas",
                subtitle: "Troceando el juego",
                icon: "list-checks",
                iconColor: "text-indigo-400",
                content: `
                    <div class="space-y-3">
                        <div class="p-2 bg-indigo-900/30 border-l-4 border-indigo-500">
                            <span class="font-bold text-[10px] uppercase">Epic:</span>
                            <p class="text-sm">"Sistema de Movimiento"</p>
                        </div>
                        <div class="p-2 bg-indigo-900/20 border-l-4 border-indigo-400 ml-4">
                            <span class="font-bold text-[10px] uppercase">User Story:</span>
                            <p class="text-sm">"Como jugador quiero saltar..."</p>
                        </div>
                        <div class="p-2 bg-indigo-900/10 border-l-4 border-indigo-300 ml-8">
                            <span class="font-bold text-[10px] uppercase">Task:</span>
                            <p class="text-xs font-mono">Implementar gravedad en Player.java</p>
                        </div>
                    </div>
                `
            },
            {
                title: "Gestión en 5 Minutos",
                subtitle: "¿Qué herramienta elegir?",
                icon: "wrench",
                iconColor: "text-pink-400",
                content: `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-orange-900/20 border border-orange-500/50 rounded">
                            <h3 class="font-bold text-orange-400 text-sm mb-1">Trello</h3>
                            <p class="text-[10px]">Visual y rápido.</p>
                        </div>
                        <div class="p-4 bg-blue-900/20 border border-blue-500/50 rounded">
                            <h3 class="font-bold text-blue-400 text-sm mb-1">GitHub Projects</h3>
                            <p class="text-[10px] font-bold">RECOMENDADO.</p>
                            <p class="text-[10px]">Todo integrado con el código.</p>
                        </div>
                    </div>
                `
            },
            {
                title: "El Peligro del WIP",
                subtitle: "Work In Progress",
                icon: "alert-triangle",
                iconColor: "text-red-500",
                content: `
                    <div class="space-y-4">
                        <div class="bg-red-900/30 p-4 border border-red-500 rounded text-sm">
                            "Si sois 3 en el equipo, no puede haber 6 tareas en 'Doing'."
                        </div>
                        <ul class="list-disc ml-6 space-y-1 text-xs text-gray-300">
                            <li>Prioriza terminar tareas antes de empezar nuevas.</li>
                            <li>Evita código a medias al final de la jornada.</li>
                        </ul>
                    </div>
                `
            },
            {
                title: "UML: El Plano Real",
                subtitle: "Dibuja antes de picar",
                icon: "git-branch",
                iconColor: "text-cyan-400",
                content: `
                    <div class="space-y-4 text-sm">
                        <p>Dedicar 1 hora al UML ahorra 5 horas de refactorización.</p>
                        <div class="bg-gray-800 p-4 rounded flex justify-center border border-cyan-500/30">
                            <div class="grid grid-cols-2 gap-2 text-[10px] font-mono">
                                <div class="border p-1">GameEngine<hr/>- player: Player</div>
                                <div class="border p-1">Entity<hr/>+ update()</div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                title: "El Cronómetro: 28 Horas",
                subtitle: "Gestión del tiempo",
                icon: "clock",
                iconColor: "text-orange-400",
                content: `
                    <div class="space-y-4">
                        <div class="w-full bg-gray-700 h-8 rounded-full overflow-hidden flex text-[10px] font-bold">
                            <div class="w-1/4 bg-blue-500 h-full flex items-center justify-center">Diseño (7h)</div>
                            <div class="w-1/2 bg-green-500 h-full flex items-center justify-center">Dev (14h)</div>
                            <div class="w-1/4 bg-red-500 h-full flex items-center justify-center">TEST (7h)</div>
                        </div>
                        <p class="text-sm text-center font-bold text-red-400">Reservad las últimas 4-6h para BUGS.</p>
                    </div>
                `
            },
            {
                title: "Action Plan",
                subtitle: "¡A por ello!",
                icon: "rocket",
                iconColor: "text-white",
                content: `
                    <ol class="space-y-2 text-sm">
                        <li class="flex items-center space-x-2">
                            <span class="bg-white text-black rounded-full w-5 h-5 flex items-center justify-center font-bold text-xs">1</span>
                            <span>GitHub + Markdown.</span>
                        </li>
                        <li class="flex items-center space-x-2">
                            <span class="bg-white text-black rounded-full w-5 h-5 flex items-center justify-center font-bold text-xs">2</span>
                            <span>Setup de Repo y Kanban.</span>
                        </li>
                        <li class="flex items-center space-x-2">
                            <span class="bg-white text-black rounded-full w-5 h-5 flex items-center justify-center font-bold text-xs">3</span>
                            <span>Esbozar GDD.md.</span>
                        </li>
                        <li class="flex items-center space-x-2">
                            <span class="bg-white text-black rounded-full w-5 h-5 flex items-center justify-center font-bold text-xs">4</span>
                            <span>UML inicial.</span>
                        </li>
                        <li class="flex items-center space-x-2">
                            <span class="bg-white text-black rounded-full w-5 h-5 flex items-center justify-center font-bold text-xs">5</span>
                            <span>Hito de Testeo.</span>
                        </li>
                    </ol>
                `
            }
        ];

        let currentSlideIdx = 0;

        function updateSlide() {
            const slide = slides[currentSlideIdx];
            const progress = ((currentSlideIdx + 1) / slides.length) * 100;

            // Actualizar textos
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-subtitle').innerText = slide.subtitle;
            document.getElementById('slide-number').innerText = `Diapositiva ${currentSlideIdx + 1} de ${slides.length}`;
            document.getElementById('progress').style.width = `${progress}%`;

            // Actualizar icono
            const iconEl = document.getElementById('slide-icon');
            iconEl.setAttribute('data-lucide', slide.icon);
            iconEl.className = `w-12 h-12 ${slide.iconColor}`;

            // Actualizar contenido
            document.getElementById('content-area').innerHTML = slide.content;

            // Actualizar puntos (dots)
            renderDots();

            // Re-renderizar iconos de Lucide
            lucide.createIcons();
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots');
            dotsContainer.innerHTML = '';
            slides.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `h-2 rounded-full transition-all ${idx === currentSlideIdx ? 'bg-blue-500 w-6' : 'bg-slate-700 w-2'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function nextSlide() {
            currentSlideIdx = (currentSlideIdx + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            currentSlideIdx = (currentSlideIdx - 1 + slides.length) % slides.length;
            updateSlide();
        }

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Inicializar
        window.onload = updateSlide;
    </script>
</body>

</html>
